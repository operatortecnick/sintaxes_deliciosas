[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sintaxes-deliciosas"
version = "1.0.0"
description = "CLI assistant de luxo - Corretor supremo e assistente IA personalizado"
readme = "README.md"
license = "MIT"
authors = [
    {name = "operatortecnick", email = "operatortecnick@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "keyring>=24.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
sintaxes = "sintaxes_deliciosas.cli:main"
sd = "sintaxes_deliciosas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sintaxes_deliciosas"]

[project.urls]
Homepage = "https://github.com/operatortecnick/sintaxes_deliciosas"
Repository = "https://github.com/operatortecnick/sintaxes_deliciosas"
Issues = "https://github.com/operatortecnick/sintaxes_deliciosas/issues"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]